baseURL = "https://go-turn.github.io/"
title = "go-turn"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "404"]

# The design comes from the landing kit, a Hugo module pinned in go.mod.
[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[markup.goldmark.renderer]
  unsafe = true

# Each repo card. "type" says whether it is a library you import or a service
# you run. "proof" is the honest headline: what is checked, and by what.
[[params.repos]]
  name = "turn"
  what = "turnd, turnprobe, stun, server, creds, session, rendezvous"
  type = "cli"
  proof = "github.com/pion/turn/v4 allocates, permits, binds a channel and round-trips data through the server over UDP and TCP"
  result = "STUN and TURN in pure Go for WebRTC peers that cannot reach each other directly. One daemon, turnd, serves STUN Binding (RFC 8489), a TURN relay (RFC 8656) over UDP, TCP or TLS on 443, short-lived credentials minted only after an OpenID Connect login, and a rendezvous: a room a host opens and shares as one link, over gRPC carried on a WebSocket. The relay never reaches loopback, private or link-local addresses by default, and every secret is a file, never a flag value or an environment variable. turnprobe proves a deployed relay end to end."

[params.brand]
# Generated by go-fleettools/landingkit from static/img/logo.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 8.02:1, bright on the dark background 5.26:1.
  base = "#9f1239"
  deep = "#610b23"
  bright = "#f43f5e"
  shadow = "rgba(159,18,57,.7)"
  glow = "rgba(159,18,57,.6)"
  wash = "rgba(159,18,57,.10)"
  washDeep = "rgba(97,11,35,.06)"
  chipBg = "#fee8ec"
  chipBorder = "#fcc5cf"
  chipFg = "#610b23"
  chipBgDark = "rgba(244,63,94,.14)"
  chipBorderDark = "rgba(244,63,94,.32)"
  chipFgDark = "#f995a6"
  statsEnd = "#fcd1d8"
  bandText = "#fde0e5"
  accent = "#9f1239"
  accentDark = "#f43f5e"

# The hero's buttons, rendered by landingkit's cta.html in the kit's order.
[[params.cta]]
  kind  = "docs"
  href  = "https://go-turn.github.io/docs/"
  label = "Documentation"
[[params.cta]]
  kind  = "github"
  href  = "https://github.com/go-turn"
  label = "GitHub"
